<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizPilot AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .box {
      background: #1e293b;
      padding: 25px;
      border-radius: 18px;
    }

    input,
    textarea {
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    .generate {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #6366f1;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:hover {
      background: #4f46e5;
    }

    #result {
      margin-top: 30px;
      display: none;
    }

    .website {
      background: white;
      color: #111827;
      border-radius: 18px;
      overflow: hidden;
    }

    .hero {
      padding: 45px 25px;
      text-align: center;
      background: linear-gradient(135deg, #111827, #4f46e5);
      color: white;
    }

    .hero h2 {
      font-size: 34px;
      margin: 0 0 10px;
    }

    .hero p {
      color: #e5e7eb;
      font-size: 17px;
    }

    .section {
      padding: 25px;
    }

    .section h3 {
      font-size: 24px;
      margin-top: 0;
    }

    .service {
      padding: 15px;
      margin: 10px 0;
      background: #f3f4f6;
      border-radius: 10px;
    }

    .contact {
      text-align: center;
      padding: 25px;
      background: #f8fafc;
    }

    .call,
    .whatsapp {
      display: inline-block;
      padding: 13px 20px;
      margin: 5px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .call {
      background: #2563eb;
    }

    .whatsapp {
      background: #16a34a;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚀 BizPilot AI</h1>

  <p class="subtitle">
    Create a professional website for your local business.
  </p>

  <div class="box">

    <input id="businessName" placeholder="Business Name">

    <input id="businessType"
      placeholder="Business Type (Salon, Cafe, Gym...)">

    <input id="phone"
      placeholder="Phone / WhatsApp Number">

    <textarea id="details"
      placeholder="Tell us about your business, services, location, timings..."></textarea>

    <button class="generate" onclick="generateWebsite()">
      ✨ Generate My Website
    </button>

    <div id="result"></div>

  </div>

</div>

<script>

async function generateWebsite() {

  const name =
    document.getElementById("businessName").value.trim();

  const type =
    document.getElementById("businessType").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const details =
    document.getElementById("details").value.trim();

  const result =
    document.getElementById("result");

  if (!name || !type) {
    alert("Please enter Business Name and Business Type.");
    return;
  }

  result.style.display = "block";

  result.innerHTML =
    '<div class="loading">⏳ AI is creating your website...</div>';

  try {

    const response = await fetch("/api/generate", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        businessName: name,

        businessType: type,

        phone: phone,

        details: details

      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Something went wrong"
      );
    }

    const whatsappNumber =
      phone.replace(/\D/g, "");

    result.innerHTML = `

      <div class="website">

        <div class="hero">

          <h2>${name}</h2>

          <p>${type}</p>

          <p>
            ${details}
          </p>

        </div>

        <div class="section">

          <h3>✨ About Our Business</h3>

          <p>
            ${data.ai || "Welcome to our business."}
          </p>

        </div>

        <div class="section">

          <h3>✂️ Our Services</h3>

          <div class="service">
            ✂️ Professional Haircut
          </div>

          <div class="service">
            🧔 Beard Grooming
          </div>

          <div class="service">
            💆 Hair Spa
          </div>

          <div class="service">
            ✨ Facial
          </div>

        </div>

        <div class="contact">

          <h3>📞 Contact Us</h3>

          <p>
            Call or WhatsApp us today.
          </p>

          <a
            class="call"
            href="tel:${phone}">
            📞 Call Now
          </a>

          <a
            class="whatsapp"
            href="https://wa.me/${whatsappNumber}"
            target="_blank">
            💬 WhatsApp
          </a>

        </div>

      </div>

    `;

  } catch (error) {

    result.innerHTML =
      "❌ " + error.message;

  }

}

</script>

</body>
</html>
