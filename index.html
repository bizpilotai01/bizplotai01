<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BizPilot AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1120;
  color:#e5e7eb;
}

.topbar{
  height:64px;
  background:#111827;
  border-bottom:1px solid #263244;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.status{
  color:#22c55e;
  font-size:13px;
}

.workspace{
  min-height:calc(100vh - 64px);
  display:grid;
  grid-template-columns:210px 350px 1fr;
}

.files{
  background:#0f172a;
  border-right:1px solid #263244;
  padding:18px;
}

.files h3{
  color:#94a3b8;
  font-size:13px;
}

.file{
  padding:10px;
  border-radius:7px;
  margin-bottom:5px;
  font-size:14px;
}

.file.active,
.file:hover{
  background:#1e293b;
}

.agent{
  background:#111827;
  border-right:1px solid #263244;
  display:flex;
  flex-direction:column;
}

.agent-header{
  padding:18px;
  border-bottom:1px solid #263244;
}

.agent-header h2{
  margin:0 0 5px;
}

.agent-header p{
  margin:0;
  color:#94a3b8;
  font-size:13px;
}

.chat{
  flex:1;
  padding:18px;
  overflow:auto;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
  font-size:14px;
  line-height:1.5;
}

.ai{
  background:#1e293b;
}

.user{
  background:#4f46e5;
}

.chatbox{
  padding:15px;
  border-top:1px solid #263244;
}

textarea{
  width:100%;
  height:85px;
  resize:none;
  padding:12px;
  border-radius:9px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
}

.controls{
  display:flex;
  gap:8px;
  margin-top:8px;
}

select{
  flex:1;
  padding:10px;
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  border-radius:8px;
}

button{
  border:0;
  border-radius:8px;
  background:#6366f1;
  color:white;
  padding:10px 16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#4f46e5;
}

.preview-area{
  background:#020617;
  display:flex;
  flex-direction:column;
}

.preview-bar{
  height:50px;
  border-bottom:1px solid #263244;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.preview-title{
  font-size:14px;
}

.preview-actions button{
  background:#1e293b;
  font-size:12px;
  padding:7px 12px;
}

.preview{
  flex:1;
  margin:18px;
  background:white;
  color:#111827;
  border-radius:12px;
  overflow:auto;
}

.site-hero{
  padding:70px 30px;
  text-align:center;
  color:white;
}

.site-hero h1{
  margin:0 0 15px;
  font-size:40px;
}

.site-hero p{
  max-width:700px;
  margin:auto;
  line-height:1.6;
}

.site-section{
  padding:30px;
  max-width:850px;
  margin:auto;
}

.service{
  padding:16px;
  margin:10px 0;
  border-radius:9px;
}

.buttons{
  text-align:center;
  padding:30px;
}

.action-button{
  display:inline-block;
  margin:6px;
  padding:13px 20px;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.whatsapp{
  background:#16a34a;
}

.call{
  background:#2563eb;
}

.loading{
  padding:40px;
  text-align:center;
  color:#64748b;
}

@media(max-width:850px){

  .workspace{
    display:block;
  }

  .files{
    display:none;
  }

  .agent{
    min-height:480px;
  }

  .preview-area{
    min-height:600px;
  }
}
</style>
</head>

<body>

<div class="topbar">

<div class="logo">
🚀 BizPilot AI
</div>

<div class="status">
● AI Agent Online
</div>

</div>

<div class="workspace">

<div class="files">

<h3>PROJECT</h3>

<div class="file active">
📄 index.html
</div>

<div class="file">
⚙️ generate.js
</div>

<div class="file">
📁 api/
</div>

<h3>TOOLS</h3>

<div class="file">
🌐 Live Preview
</div>

<div class="file">
🚀 Publish
</div>

</div>


<div class="agent">

<div class="agent-header">

<h2>🤖 AI Agent</h2>

<p>
Build and modify your website using natural language.
</p>

</div>

<div class="chat" id="chat">

<div class="message ai">
👋 Hi! Tell me what you want to build or change.
</div>

<div class="message ai" id="loadStatus">
⏳ Loading saved website...
</div>

</div>

<div class="chatbox">

<textarea
id="command"
placeholder="Example: Make the background black and add WhatsApp booking button..."
></textarea>

<div class="controls">

<select id="model">

<option value="gemini">
Gemini
</option>

<option value="openai">
OpenAI
</option>

<option value="anthropic">
Anthropic
</option>

<option value="kimi">
Kimi
</option>

</select>

<button onclick="runAgent()">
Send
</button>

</div>

</div>

</div>


<div class="preview-area">

<div class="preview-bar">

<div class="preview-title">
🌐 Live Preview
</div>

<div class="preview-actions">

<button onclick="loadSavedWebsite()">
↻ Refresh
</button>

<button onclick="publishSite()">
🚀 Publish
</button>

</div>

</div>

<div class="preview" id="preview">

<div class="loading">
Loading your website...
</div>

</div>

</div>

</div>


<script>

let business = {

name:"Royal Hair Salon",

type:"Salon",

phone:"",

details:
"Haircut, beard grooming, hair spa and facial. Open daily from 10 AM to 9 PM."

};


/*
  Current website state.
  This is updated every time AI changes the website.
*/

let currentAgentState = null;


/*
  Load saved website from Supabase
  through /api/generate GET endpoint.
*/

async function loadSavedWebsite(){

const preview =
document.getElementById("preview");

const loadStatus =
document.getElementById("loadStatus");

try{

preview.innerHTML = `
<div class="loading">
⏳ Loading saved website...
</div>
`;

const response =
await fetch(
"/api/generate?businessName=" +
encodeURIComponent(business.name)
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error || "Could not load website"
);

}


/*
  If project exists, restore it.
*/

if(data.project && data.project.website_state){

currentAgentState =
data.project.website_state;

renderWebsite(
currentAgentState
);

loadStatus.innerHTML =
"✅ Saved website loaded.";

}else{

loadStatus.innerHTML =
"ℹ️ No saved website found. Create one using the AI Agent.";

preview.innerHTML = `
<div class="loading">
Your AI-generated website will appear here.
</div>
`;

}

}catch(error){

console.error(error);

loadStatus.innerHTML =
"⚠️ Could not load saved website.";

preview.innerHTML = `
<div class="loading">
Website is ready. Use the AI Agent to create it.
</div>
`;

}

}


/*
  AI Agent
*/

async function runAgent(){

const command =
document.getElementById("command")
.value
.trim();

const model =
document.getElementById("model")
.value;

const chat =
document.getElementById("chat");

if(!command){

return;

}


/*
  User message
*/

chat.innerHTML += `
<div class="message user">
${escapeHtml(command)}
</div>
`;


/*
  Thinking message
*/

chat.innerHTML += `
<div class="message ai" id="thinking">
⏳ AI Agent is working...
</div>
`;

chat.scrollTop =
chat.scrollHeight;


try{

const response =
await fetch(
"/api/generate",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

businessName:
business.name,

businessType:
business.type,

phone:
business.phone,

details:
business.details,

command:
command,

model:
model,

/*
  Send current website state
  so AI knows what already exists.
*/

existingState:
currentAgentState

})

});


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"AI Agent error"
);

}


/*
  Receive updated website.
*/

const agent =
data.agent || {};


/*
  Save it locally in memory.
*/

currentAgentState =
agent;


/*
  Update chat.
*/

const thinking =
document.getElementById("thinking");

if(thinking){

thinking.innerHTML =
"✅ Website updated and saved.";

}


/*
  Render website.
*/

renderWebsite(
agent
);


/*
  Clear command.
*/

document.getElementById(
"command"
).value = "";


/*
  Scroll chat.
*/

chat.scrollTop =
chat.scrollHeight;


}catch(error){

const thinking =
document.getElementById("thinking");

if(thinking){

thinking.innerHTML =
"❌ " +
escapeHtml(
error.message
);

}

}

}


/*
  Render AI website preview.
*/

function renderWebsite(agent){

const preview =
document.getElementById("preview");

const design =
agent.design || {};

const services =
agent.services || [];

const buttons =
agent.buttons || [];


const primaryColor =
design.primaryColor ||
"#6366f1";

const backgroundColor =
design.backgroundColor ||
"#ffffff";

const textColor =
design.textColor ||
"#111827";

const heroBackground =
design.heroBackground ||
"#111827";


preview.innerHTML = `

<div
class="site-hero"
style="
background:${escapeHtml(heroBackground)};
">

<h1>
${escapeHtml(
agent.headline ||
business.name
)}
</h1>

<p>
${escapeHtml(
agent.description ||
business.details
)}
</p>

</div>


<div
class="site-section"
style="
background:${escapeHtml(backgroundColor)};
color:${escapeHtml(textColor)};
">

<h2>
✨ About
</h2>

<p>
${escapeHtml(
agent.description ||
business.details
)}
</p>


<h2>
🛠️ Services
</h2>


${
services.map(service => {

const serviceName =
typeof service === "string"
? service
: service.name || "";

const serviceDescription =
typeof service === "object"
? service.description || ""
: "";

return `

<div
class="service"
style="
background:${escapeHtml(primaryColor)}15;
border-left:4px solid ${escapeHtml(primaryColor)};
">

<strong>
${escapeHtml(serviceName)}
</strong>

${
serviceDescription
? `<p>${escapeHtml(serviceDescription)}</p>`
: ""
}

</div>

`;

}).join("")
}


<h2>
🚀 AI Changes
</h2>

<p>

${
(agent.changes || [])
.map(change =>
"✓ " +
escapeHtml(change)
)
.join("<br>")
}

</p>

</div>


<div
class="buttons"
style="
background:${escapeHtml(backgroundColor)};
">

<h2>
${escapeHtml(
agent.cta ||
"Book Your Appointment"
)}
</h2>


${
buttons.map(button => {

if(button.type === "whatsapp"){

const number =
business.phone
.replace(/\D/g,"");


return `

<a
class="action-button whatsapp"
href="https://wa.me/${number}"
target="_blank">

💬 ${escapeHtml(
button.label ||
"WhatsApp"
)}

</a>

`;

}


if(button.type === "call"){

return `

<a
class="action-button call"
href="tel:${business.phone}">

📞 ${escapeHtml(
button.label ||
"Call Now"
)}

</a>

`;

}


return "";

}).join("")
}


<a
class="action-button call"
href="tel:${business.phone}">

📞 Call Now

</a>


</div>

`;

}


/*
  Publish placeholder
*/

function publishSite(){

alert(
"🚀 Publishing system will be connected in the next phase."
);

}


/*
  Security helper
*/

function escapeHtml(text){

return String(
text || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/*
  Automatically load saved project
  when page opens.
*/

window.addEventListener(
"DOMContentLoaded",
function(){

loadSavedWebsite();

}
);

</script>

</body>
</html>
