<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BizPilot AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

h1{
  text-align:center;
  font-size:40px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
}

.dashboard{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
  margin-top:30px;
}

.panel{
  background:#1e293b;
  padding:20px;
  border-radius:16px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:0;
  border-radius:8px;
  font-size:15px;
}

textarea{
  height:130px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#6366f1;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#4f46e5;
}

.preview{
  background:white;
  color:#111827;
  min-height:500px;
  border-radius:16px;
  overflow:hidden;
}

.preview-header{
  background:linear-gradient(135deg,#111827,#4f46e5);
  color:white;
  padding:50px 25px;
  text-align:center;
}

.preview-header h2{
  font-size:36px;
  margin:0 0 10px;
}

.preview-section{
  padding:25px;
}

.service{
  background:#f1f5f9;
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#64748b;
}

@media(max-width:800px){
  .dashboard{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 BizPilot AI</h1>

<p class="subtitle">
Your AI Website Building Agent
</p>

<div class="dashboard">

<div class="panel">

<h2>🤖 AI Agent</h2>

<label>AI Model</label>

<select id="model">
<option value="gemini">Gemini</option>
<option value="openai">OpenAI</option>
<option value="anthropic">Anthropic</option>
<option value="kimi">Kimi</option>
</select>

<input
id="businessName"
placeholder="Business Name">

<input
id="businessType"
placeholder="Business Type">

<input
id="phone"
placeholder="Phone / WhatsApp">

<textarea
id="details"
placeholder="Describe your business..."></textarea>

<textarea
id="command"
placeholder="Tell AI what to build or change...
Example: Make a modern salon website"></textarea>

<button onclick="runAgent()">
✨ Run AI Agent
</button>

</div>

<div class="preview" id="preview">

<div class="loading">
👋 Enter your business details and tell the AI Agent what to build.
</div>

</div>

</div>

</div>

<script>

async function runAgent(){

const businessName =
document.getElementById("businessName").value.trim();

const businessType =
document.getElementById("businessType").value.trim();

const phone =
document.getElementById("phone").value.trim();

const details =
document.getElementById("details").value.trim();

const command =
document.getElementById("command").value.trim();

const model =
document.getElementById("model").value;

const preview =
document.getElementById("preview");

if(!businessName || !businessType){

alert("Business Name aur Business Type bharo.");

return;
}

preview.innerHTML = `
<div class="loading">
⏳ AI Agent is building your website...
</div>
`;

try{

const response = await fetch("/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

businessName,
businessType,
phone,
details,
command,
model

})

});

const data = await response.json();

if(!response.ok){

throw new Error(
data.error || "AI Agent error"
);

}

const agent = data.agent || {};

const services =
agent.services || [];

preview.innerHTML = `

<div class="preview-header">

<h2>
${agent.headline || businessName}
</h2>

<p>
${agent.description || details}
</p>

</div>

<div class="preview-section">

<h2>✨ About</h2>

<p>
${agent.description || details}
</p>

<h2>🛠️ Services</h2>

${
services.map(service => `
<div class="service">
${service}
</div>
`).join("")
}

<h2>🚀 AI Changes</h2>

<p>
${
(agent.changes || [])
.join("<br>")
}
</p>

</div>

`;

}catch(error){

preview.innerHTML = `
<div class="loading">
❌ ${error.message}
</div>
`;

}

}

</script>

</body>
</html>
